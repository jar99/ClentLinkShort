name: Deploy to GitHub Pages

on:
  push:
    # Deploys come from main and nowhere else; feature branches get the same
    # checks from ci.yml without touching the live site.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deployment mid-flight; queued runs wait their turn.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The full gate runs here, not just the unit tests: a regression that
      # only tsc or the browser suite can see must not ship. Corpus
      # validation stays in ci.yml — it gates merges, not deploys.
      - name: Unit, property, security and minifier tests
        run: node --test test/*.test.js

      - name: JSDoc and declaration soundness
        run: |
          npm install --no-save typescript@7 @types/node
          npx tsc -p tsconfig.json

      - name: Build
        run: node tools/build.mjs

      - name: End-to-end against the site that is about to ship
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node tools/browser-test.mjs dist

      # The browser test and npm leave droppings; rebuild so the uploaded
      # artifact is exactly what tools/build.mjs makes and nothing else.
      - name: Rebuild clean
        run: node tools/build.mjs

      # enablement: true flips the Pages source to "GitHub Actions" by API,
      # so no dashboard step is needed and the Jekyll branch builds stop.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
