name: Publish corpus

# The corpus is 66 MB of brotli and does not delta-compress, so every update
# used to add another whole copy to the repository's history forever. It lives
# as a release asset instead: one download, verified against its own hash, and
# a clone stays small no matter how far the corpus grows.
#
# Run this after `npm run corpus:update` produces a new snapshot, then commit
# the manifest pointing at the new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for this snapshot, e.g. corpus-2026-08-18"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Publishing a corpus whose hash disagrees with the manifest would give
      # every later download something to verify against that never matches.
      # Two hashes, because they answer different questions: sha256 is over the
      # DECOMPRESSED corpus and is its identity, while asset.sha256 covers the
      # bytes that actually travel, so a download can be checked without first
      # decompressing 238 MB.
      - name: The corpus must match its manifest
        run: |
          node -e '
            const fs = require("node:fs"), zlib = require("node:zlib");
            const { createHash } = require("node:crypto");
            const m = JSON.parse(fs.readFileSync("corpus/manifest.json", "utf8"));
            const br = fs.readFileSync("corpus/urls.txt.br");
            const raw = zlib.brotliDecompressSync(br);
            const sha = (b) => createHash("sha256").update(b).digest("hex");
            const checks = [
              ["corpus", m.sha256, sha(raw)],
              ["asset", m.asset?.sha256, sha(br)],
            ];
            let bad = false;
            for (const [what, want, got] of checks) {
              console.log(`${what}: manifest ${want} file ${got}`);
              if (want !== got) bad = true;
            }
            if (bad) { console.error("manifest does not describe this corpus"); process.exit(1); }
          '

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          total=$(node -p "require('./corpus/manifest.json').total.toLocaleString('en-US')")
          sha=$(node -p "require('./corpus/manifest.json').sha256")
          gh release create "$TAG" corpus/urls.txt.br \
            --title "Corpus snapshot $TAG" \
            --notes "$total real URLs, brotli-compressed.

          sha256 \`$sha\`

          Fetched by \`npm run corpus:get\`, which verifies this hash against
          \`corpus/manifest.json\`. Not committed to the repository: brotli does
          not delta-compress, so each snapshot would otherwise add its whole
          size to every future clone."
