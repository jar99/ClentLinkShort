name: CI

on:
  push:
    branches: [claude/github-pages-link-shortener-1bozyz, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No install step: the library, the tests and the build have no
      # dependencies at all, so there is nothing to fetch or audit.
      - name: Unit, property, security and minifier tests
        run: node --test test/*.test.js

      - name: Validate against the frozen real-URL corpus
        run: node tools/validate-corpus.mjs

      - name: Build
        run: node tools/build.mjs

      - name: The committed corpus stats must match the corpus
        run: git diff --exit-code corpus/stats.json

      # GitHub refuses a push containing a file over 100 MB, and the refusal
      # arrives at push time, after the corpus run that produced it. Fail here
      # instead, while there is still room to do something about it.
      - name: The corpus must stay pushable
        run: |
          bytes=$(stat -c%s corpus/urls.txt.br)
          mb=$((bytes / 1048576))
          echo "corpus/urls.txt.br is ${mb} MB"
          if [ "$mb" -ge 90 ]; then
            echo "::error::corpus/urls.txt.br is ${mb} MB; GitHub rejects pushes over 100 MB." \
                 "Move the corpus to a release asset or Git LFS before growing it further."
            exit 1
          fi
          if [ "$mb" -ge 75 ]; then
            echo "::warning::corpus/urls.txt.br is ${mb} MB, approaching GitHub's 100 MB limit."
          fi

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # CI-only dependency, same pattern as the playwright job below: the
      # library itself stays zero-dependency and devDependencies stays empty.
      - run: npm install --no-save typescript@7 @types/node
      - name: JSDoc and declaration soundness
        run: npx tsc -p tsconfig.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The only place a dependency appears, and it stays out of the library.
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium

      # Builds from the committed corpus stats; no need to re-measure here.
      - run: node tools/build.mjs
      - name: End-to-end against the built site
        run: node tools/browser-test.mjs dist
      - name: End-to-end against the unbuilt sources
        run: node tools/browser-test.mjs src

  # The deploy is a job here rather than its own workflow so that "needs"
  # orders it. As two workflows on the same push they started together, which
  # meant the live site could be updated while the suite was still running —
  # and stay updated if it then failed. Corpus validation in particular only
  # ever ran in CI, so a commit whose stats disagreed with the corpus, or
  # whose links no longer round-tripped, could ship regardless.
  #
  # Nothing is re-tested here: needs guarantees the whole suite passed on this
  # exact commit, so the job only builds the artifact and publishes it.
  deploy:
    needs: [test, types, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      # Never cancel a deployment mid-flight; queued runs wait their turn.
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Full history: the build stamp names the last commit that touched a
      # page input, which a shallow clone cannot answer.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Publishing is not free: the page is one file, so a deploy invalidates
      # every visitor's cached copy. The build is reproducible from a known
      # set of inputs, so if this push touched none of them the page would be
      # byte-identical and there is nothing to publish. Fails open — an
      # unknown or unreachable base deploys rather than silently skipping.
      - id: inputs
        name: Did anything the page is built from change?
        run: |
          paths="src corpus/stats.json package.json tools/build.mjs tools/bundle.js tools/minify.js"
          before="${{ github.event.before }}"
          changed=yes
          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$before^{commit}" 2>/dev/null; then
            if git diff --quiet "$before" "${{ github.sha }}" -- $paths; then
              changed=no
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = no ]; then
            echo "No page input changed in this push; the built page would be identical." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Builds from the committed corpus stats, which the test job has already
      # confirmed match the corpus.
      - name: Build
        if: steps.inputs.outputs.changed == 'yes'
        run: node tools/build.mjs

      # enablement: true flips the Pages source to "GitHub Actions" by API,
      # so no dashboard step is needed and the Jekyll branch builds stop.
      - uses: actions/configure-pages@v5
        if: steps.inputs.outputs.changed == 'yes'
        with:
          enablement: true

      # Rolled by hand instead of actions/upload-pages-artifact, which tars
      # with --exclude=".[^/]*" and exposes no way to turn that off — so it
      # silently drops every dotfile, and /.well-known/security.txt with it.
      # Same archive, same artifact name deploy-pages expects, minus the
      # exclusion. (.git and .github are not in dist; excluded anyway to match.)
      - name: Archive the site, hidden files included
        if: steps.inputs.outputs.changed == 'yes'
        run: |
          tar --dereference --hard-dereference --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.changed == 'yes'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          include-hidden-files: true
      - id: deploy
        if: steps.inputs.outputs.changed == 'yes'
        uses: actions/deploy-pages@v4
